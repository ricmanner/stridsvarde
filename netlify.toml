# Netlify-konfiguration för FM – PSVI.
#
# Appen är inte statisk. Den har serverkomponenter, sessioner och en databas,
# så den körs som serverlösa funktioner via Netlifys Next.js-plugin — inte som
# filer i en mapp, vilket demoversionen var.
#
# Databasen kan INTE ligga på disk här: filsystemet är flyktigt och delas inte
# mellan anrop. DATABASE_URL måste peka på en libsql://-databas.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Önskad region för funktionen.
#
# HAR INGEN EFFEKT PÅ NUVARANDE PLAN. Netlify kör funktionen i us-east-2
# medan Turso ligger i eu-west-1, så varje SQL-anrop korsar Atlanten: samma
# adminsida tar 0,3 s lokalt men runt 0,9 s i drift. Regionval kräver betald
# plan — försök att sätta det via API:et avvisas med 422 — och raden står
# kvar eftersom den blir verksam den dagen planen ändras.
#
# Det är också fel geografi i sak: hälsodata bör ligga inom EU, och då bör
# koden som läser den göra det med. Vid ett skarpt införande driftar
# Försvarsmakten själv och frågan ser annorlunda ut.
[functions]
  region = "eu-west-1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
