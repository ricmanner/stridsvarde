# Kör samma kontroller som före en driftsättning, vid varje push.
#
# Poängen är att de inte ska bero på att någon kommer ihåg dem. Går något av
# stegen fel syns det på committen i GitHub, innan Vercel hunnit publicera.
#
# Bara den här grenen. main och pilot rörs inte.
name: Kontroll

on:
  push:
    branches: [v2-produktion]
  pull_request:
    branches: [v2-produktion]

# Maskinen är fastlåst, inte "senaste".
#
# GitHub låter ubuntu-latest bli Ubuntu 26 från den 19 oktober 2026. Ett byte
# av maskin ändrar webbläsare, systembibliotek och tempo, och webbläsartesterna
# här har fallit på just tempo två gånger. Att det sker av sig självt, kanske
# dagarna före en visning, är det vi undviker — med en fast version väljer vi
# själva när vi tar bytet, och vi kan köra det en gång och se att det håller.
#
# Höj till ubuntu-26.04 när det finns tid att titta på resultatet. Den här
# raden är inte tänkt att stå kvar för alltid.
jobs:
  kontroll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typer
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src tests
      - name: Tester
        run: npm test
      # Bygget sist: det tar längst tid, och de snabba kontrollerna ska hinna
      # svara först. Utan det här steget upptäcktes ett trasigt bygge först när
      # Vercel försökte driftsätta — alltså efter att ändringen redan var pushad.
      - name: Bygge
        run: npm run build

  # Webbläsartesterna i ett eget jobb: de tar några minuter och behöver en
  # webbläsare, medan typer, lint och enhetstester svarar på under en minut.
  # Delade de jobb skulle det snabba beskedet fastna bakom det långsamma.
  webblasare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Hämta webbläsaren
        run: npx playwright install --with-deps chromium
      - name: Tester i webbläsare
        run: npm run e2e
        env:
          CI: 'true'
      - name: Spara spår vid fel
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 7
